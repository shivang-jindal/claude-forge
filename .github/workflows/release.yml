name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "workflow_dispatch" ]; then TAG="${{ github.event.inputs.tag }}"; fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing $TAG to npm as $(node -p "require('./package.json').name")"

      - name: Verify the tree is green
        # Same gate a contributor runs locally: unit tests + the eval gate.
        run: node src/cli.ts ci

      - name: Verify the package can be built and loaded
        # Packs the tarball, installs it into a temp project, and runs the
        # published binary. This is the check that catches a broken publish
        # before it reaches npm.
        run: |
          set -euo pipefail
          npm pack
          TGZ=$(ls -1 ./*.tgz)
          TMP=$(mktemp -d)
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$OLDPWD/$TGZ" --no-audit --no-fund
          ./node_modules/.bin/forge --help >/dev/null
          ./node_modules/.bin/forge init smoke >/dev/null
          cd smoke
          ../node_modules/.bin/forge eval evals/feature.dataset.json --trials 1
          ../node_modules/.bin/forge ci
          echo "Package smoke test passed."

      - name: Publish to npm
        # npm's registry is the source of truth: if this version is already
        # there, skip the publish rather than failing the whole release. This
        # keeps the workflow re-runnable and safe after a manual first publish.
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already published — skipping npm publish."
            echo "SKIP_NPM_PUBLISH=1" >> "$GITHUB_ENV"
          else
            echo "Publishing $PKG@$VER"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: env.SKIP_NPM_PUBLISH != '1'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            npm install -g claude-forge-cli
            forge --help
            ```

            Or clone and run it directly — no install, no build step:

            ```bash
            git clone https://github.com/shivang-jindal/claude-forge.git
            cd claude-forge
            node src/cli.ts --help
            ```

            Requires **Node 24+** (native TypeScript, zero dependencies).

