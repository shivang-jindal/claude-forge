name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "workflow_dispatch" ]; then TAG="${{ github.event.inputs.tag }}"; fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing $TAG to npm as $(node -p "require('./package.json').name")"

      - name: Verify the tree is green
        # Same gate a contributor runs locally: unit tests + the eval gate.
        run: node src/cli.ts ci

      - name: Verify the package can be built and loaded
        # Packs the tarball, installs it into a temp project, and runs the
        # published binary. This is the check that catches a broken publish
        # before it reaches npm.
        run: |
          set -euo pipefail
          npm pack
          TGZ=$(ls -1 ./*.tgz)
          TMP=$(mktemp -d)
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$OLDPWD/$TGZ" --no-audit --no-fund
          ./node_modules/.bin/forge --help >/dev/null
          ./node_modules/.bin/forge init smoke >/dev/null
          cd smoke
          ../node_modules/.bin/forge eval evals/feature.dataset.json --trials 1
          ../node_modules/.bin/forge ci
          echo "Package smoke test passed."

      - name: Publish to npm
        # Requires either an NPM_TOKEN secret, or npm Trusted Publishing
        # (OIDC) configured for this package on npmjs.com.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
